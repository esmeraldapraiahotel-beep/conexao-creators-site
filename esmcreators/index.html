<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EsmCreators — Gestão de Creators · Esmeralda Praia Hotel</title><style id="css">
:root{
  --sand:#FAF6F0; --surface:#FFFFFF; --surface-2:#F5EFE6; --surface-3:#EFE7DA;
  --ink:#2E2620; --ink-2:#5D5147; --muted:#8E8073; --hair:#E4D9C9; --hair-2:#EFE7DB;
  --bronze:#6B5335; --bronze-ink:#FFF8EE; --bronze-soft:#EDE0CB;
  --esm:#1B7A62; --esm-soft:#DCEDE5;
  --amber:#A8742A; --amber-soft:#F7EBD0;
  --rose:#AC4530; --rose-soft:#F7E1DB;
  --slate:#5B7480; --slate-soft:#E4EBEE;
  --shadow:0 1px 2px rgba(46,38,32,.05), 0 6px 20px -12px rgba(46,38,32,.22);
  --shadow-lg:0 2px 4px rgba(46,38,32,.05), 0 22px 48px -20px rgba(46,38,32,.4);
  --r:14px; --r-sm:9px; --topbar:67px;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --font-brand:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --font-num:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --sand:#171310; --surface:#221D18; --surface-2:#2B2520; --surface-3:#332B24;
  --ink:#F3EADD; --ink-2:#C9BCAB; --muted:#94867a; --hair:#3A322A; --hair-2:#2F2822;
  --bronze:#C9A06A; --bronze-ink:#1E1813; --bronze-soft:#3B3025;
  --esm:#54C4A2; --esm-soft:#1E362F; --amber:#D9A44E; --amber-soft:#3A2F1D;
  --rose:#E08672; --rose-soft:#3B2620; --slate:#9DB6C0; --slate-soft:#253136;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px -12px rgba(0,0,0,.7);
  --shadow-lg:0 2px 4px rgba(0,0,0,.45), 0 22px 48px -20px rgba(0,0,0,.85);
}}
:root[data-theme="dark"]{
  --sand:#171310; --surface:#221D18; --surface-2:#2B2520; --surface-3:#332B24;
  --ink:#F3EADD; --ink-2:#C9BCAB; --muted:#94867a; --hair:#3A322A; --hair-2:#2F2822;
  --bronze:#C9A06A; --bronze-ink:#1E1813; --bronze-soft:#3B3025;
  --esm:#54C4A2; --esm-soft:#1E362F; --amber:#D9A44E; --amber-soft:#3A2F1D;
  --rose:#E08672; --rose-soft:#3B2620; --slate:#9DB6C0; --slate-soft:#253136;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px -12px rgba(0,0,0,.7);
  --shadow-lg:0 2px 4px rgba(0,0,0,.45), 0 22px 48px -20px rgba(0,0,0,.85);
}
:root[data-theme="light"]{
  --sand:#FAF6F0; --surface:#FFFFFF; --surface-2:#F5EFE6; --surface-3:#EFE7DA;
  --ink:#2E2620; --ink-2:#5D5147; --muted:#8E8073; --hair:#E4D9C9; --hair-2:#EFE7DB;
  --bronze:#6B5335; --bronze-ink:#FFF8EE; --bronze-soft:#EDE0CB;
  --esm:#1B7A62; --esm-soft:#DCEDE5; --amber:#A8742A; --amber-soft:#F7EBD0;
  --rose:#AC4530; --rose-soft:#F7E1DB; --slate:#5B7480; --slate-soft:#E4EBEE;
  --shadow:0 1px 2px rgba(46,38,32,.05), 0 6px 20px -12px rgba(46,38,32,.22);
  --shadow-lg:0 2px 4px rgba(46,38,32,.05), 0 22px 48px -20px rgba(46,38,32,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font-family:var(--font-ui);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--bronze)}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* shell */
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--hair-2);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:18px 16px 14px}
.mark{width:36px;height:36px;border-radius:11px;background:var(--bronze);color:var(--bronze-ink);
  display:grid;place-items:center;flex:none;font-family:var(--font-brand);font-size:17px;font-style:italic}
.brand b{display:block;font-family:var(--font-brand);font-size:16.5px;font-weight:600}
.brand span{display:block;font-size:11px;color:var(--muted)}
.navgroup{padding:8px 11px 2px}
.navgroup h6{margin:0 0 5px 10px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);font-weight:600}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;color:var(--ink-2);
  text-decoration:none;font-size:13.5px;transition:background .12s}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--bronze-soft);color:var(--ink);font-weight:600}
.nav .ic{width:16px;text-align:center;opacity:.85;font-size:12.5px}
.nav .badge{margin-left:auto;background:var(--rose);color:var(--surface);font-size:10.5px;font-weight:700;
  padding:1px 6px;border-radius:20px;font-family:var(--font-num)}
.sidefoot{margin-top:auto;padding:11px;border-top:1px solid var(--hair-2)}
.hotel{display:flex;gap:9px;align-items:center;padding:8px;border-radius:10px;background:var(--surface-2)}
.hotel .dot{width:28px;height:28px;border-radius:8px;background:var(--esm);color:#fff;display:grid;
  place-items:center;font-size:11px;font-weight:700;flex:none}
.hotel b{font-size:12.5px;display:block;line-height:1.3}
.hotel span{font-size:10.5px;color:var(--muted)}

/* top */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--sand) 90%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--hair-2);padding:14px 26px}
.toprow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.vtitle .eyebrow{font-family:var(--font-brand);font-style:italic;font-size:12px;color:var(--bronze);display:block}
.vtitle h1{margin:0;font-size:21px;letter-spacing:-.02em;font-weight:650;line-height:1.15}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--hair);
  border-radius:22px;padding:7px 14px;min-width:210px;box-shadow:var(--shadow)}
.search input{border:0;background:none;outline:none;width:100%;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--bronze);color:var(--bronze-ink);
  padding:9px 16px;border-radius:22px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--hair);font-weight:550}
.btn.ok{background:var(--esm);color:#fff} .btn.no{background:var(--rose);color:#fff}
.btn.sm{padding:7px 13px;font-size:12.5px}
.iconbtn{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--hair);
  display:grid;place-items:center;font-size:14px;box-shadow:var(--shadow)}
.wrap{padding:20px 26px 70px;max-width:1780px}
/* <b> aninhado em texto corrido nunca vira bloco */
.alert p b,.rc-w b,.rc-t b,.bbody p b,.camp-v b,.tiny b,.hint b,.verd p b,.dbio b,.mkt-l b,.notif p b,.prox p b,.inter p b,.hoje-r b,.qt b{display:inline;font-size:inherit;margin:0;line-height:inherit}

.view{display:none} .view.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* primitives */
.card{background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.grid{display:grid;gap:13px}
.sec{margin:24px 0 11px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec:first-child{margin-top:0}
.sec h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.sec p{margin:0;font-size:12.5px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap}
.p-esm{background:var(--esm-soft);color:var(--esm)} .p-amber{background:var(--amber-soft);color:var(--amber)}
.p-rose{background:var(--rose-soft);color:var(--rose)} .p-slate{background:var(--slate-soft);color:var(--slate)}
.p-bronze{background:var(--bronze-soft);color:var(--bronze)} .p-mute{background:var(--surface-3);color:var(--muted)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.tiny{font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--hair-2);margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 14px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;
  white-space:nowrap;font-weight:550}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--bronze);font-weight:650}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px}

/* alert */
.alert{display:flex;gap:12px;padding:13px 15px;border-radius:var(--r);background:var(--surface);
  border:1px solid var(--hair-2);box-shadow:var(--shadow);border-left:4px solid var(--muted)}
.alert.crit{border-left-color:var(--rose)} .alert.warn{border-left-color:var(--amber)}
.alert.ok{border-left-color:var(--esm)}
.alert .ai{font-size:17px;line-height:1.2}
.alert b{display:block;font-size:13px;margin-bottom:3px}
.alert p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5}

/* kanban */
.board{display:flex;gap:13px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:none;width:262px;background:var(--surface-2);border-radius:var(--r);border:1px solid var(--hair-2)}
.colhead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r) var(--r) 0 0;
  border-bottom:1px solid var(--hair-2)}
.colhead b{font-size:12.5px;font-weight:650}
.colhead .ct{margin-left:auto;font-family:var(--font-num);font-size:11.5px;font-weight:700;
  background:rgba(0,0,0,.08);padding:1px 7px;border-radius:20px}
.colbody{padding:9px;display:flex;flex-direction:column;gap:8px;min-height:52px;max-height:64vh;overflow-y:auto}
.ccard{background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r-sm);padding:10px 11px;
  box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s}
.ccard:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.ccard .nm{font-size:12.8px;font-weight:650;line-height:1.25}
.ccard .hd{font-size:10.5px;color:var(--muted);font-family:var(--font-num);margin-top:1px}
.ccard .ft{display:flex;align-items:center;gap:6px;margin-top:8px}
.colempty{padding:13px;font-size:11.5px;color:var(--muted);text-align:center}

/* table */
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--hair-2);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  font-weight:650;padding:11px 13px;border-bottom:1px solid var(--hair);background:var(--surface-2);
  position:sticky;top:var(--topbar);white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
th:hover{color:var(--ink)}
td{padding:10px 13px;border-bottom:1px solid var(--hair-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.r{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.nmcell b{display:block;font-size:13px;line-height:1.25}
.nmcell span{font-size:11px;color:var(--muted);font-family:var(--font-num)}

/* cockpit */
.hoje{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.hoje-d{font-family:var(--font-brand);font-size:21px;letter-spacing:-.01em;font-weight:600}
.hoje-r{font-size:13px;color:var(--muted);margin-top:2px}
.hoje-r{margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r);padding:15px 16px;
  box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:5px;
  border-left:3px solid var(--hair);transition:all .14s}
.tile:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg);border-left-color:var(--bronze)}
.tile.r{border-left-color:var(--rose)} .tile.a{border-left-color:var(--amber)} .tile.g{border-left-color:var(--esm)}
.tile-v{font-size:27px;font-weight:680;letter-spacing:-.03em;line-height:1;font-family:var(--font-num)}
.tile-l{font-size:11.5px;color:var(--muted)}
.cock{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.cock-main,.cock-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.nlist{display:flex;flex-direction:column}
.notif{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--hair-2)}
.notif:last-child{border-bottom:0}
.notif .nic{font-size:16px;line-height:1.3;flex:none}
.notif b{font-size:13px;display:block;line-height:1.35}
.notif p{margin:3px 0 0;font-size:12.3px;color:var(--ink-2);line-height:1.5}
.notif.crit{background:linear-gradient(90deg,var(--rose-soft) 0%,transparent 55%)}
.notif.warn{background:linear-gradient(90deg,var(--amber-soft) 0%,transparent 55%)}
.nact{display:flex;gap:6px;align-items:center;flex:none;flex-wrap:wrap;justify-content:flex-end}
.prox{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--hair-2)}
.prox:last-child{border-bottom:0}
.prox .av{width:34px;height:34px;border-radius:11px;background:var(--surface-3);display:grid;
  place-items:center;font-size:12px;font-weight:700;color:var(--bronze);flex:none;font-family:var(--font-brand)}
.prox b{font-size:13px;display:block}
.prox-s{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:4px}
.prox p{margin:5px 0 0;font-size:12.3px;color:var(--ink-2);line-height:1.45}
.inter{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--hair-2);cursor:pointer}
.inter:last-child{border-bottom:0}
.inter:hover{background:var(--surface-2)}
.inter-d{font-size:11px;color:var(--muted);flex:none;min-width:50px;padding-top:1px}
.inter b{font-size:12.5px;display:block}
.inter p{margin:2px 0 0;font-size:11.8px;color:var(--ink-2);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qfilt{display:flex;gap:6px;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--hair-2);
  background:var(--surface-2)}
.qf{padding:5px 11px;border-radius:20px;border:1px solid var(--hair);background:var(--surface);
  font-size:11.8px;color:var(--ink-2);transition:all .12s;white-space:nowrap}
.qf:hover{border-color:var(--bronze)}
.qf.on{background:var(--bronze);color:var(--bronze-ink);border-color:var(--bronze);font-weight:650}
.tile.on{border-left-color:var(--bronze);background:var(--bronze-soft)}
.prox-w{margin:5px 0 0!important;color:var(--muted)!important;font-size:11.8px!important}
.seta{color:var(--bronze);font-weight:700}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair-2)}
.qt{background:var(--surface);padding:15px 12px;display:flex;flex-direction:column;gap:6px;
  align-items:center;font-size:11.8px;color:var(--ink-2);transition:background .12s;text-align:center}
.qt:hover{background:var(--surface-2);color:var(--ink)}
.qt span{font-size:17px;color:var(--bronze)}
@media(max-width:1080px){.cock{grid-template-columns:1fr}}

/* gerenciar */
.gbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.gfilt{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.gfilt select{padding:7px 11px;border:1px solid var(--hair);border-radius:20px;background:var(--surface);
  font-size:12.5px;outline:none;color:var(--ink-2)}
.gfilt select:focus{border-color:var(--bronze)}
.gacts{margin-left:auto;display:flex;gap:7px}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bronze-soft);
  border:1px solid var(--bronze);border-radius:var(--r);padding:11px 14px;margin-bottom:13px}
.bulk b{font-size:12.5px;color:var(--bronze)}
.bulk select{padding:6px 10px;border:1px solid var(--hair);border-radius:9px;background:var(--surface);
  font-size:12.3px;outline:none}
tbody tr.selrow{background:var(--bronze-soft)}
tbody td select{width:100%;padding:5px 8px;border:1px solid transparent;border-radius:7px;
  background:transparent;font-size:12.2px;outline:none;cursor:pointer;color:var(--ink-2)}
tbody td select:hover{border-color:var(--hair);background:var(--surface-2)}
tbody td select:focus{border-color:var(--bronze);background:var(--surface)}
.bar{height:5px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-bottom:3px}
.bar-f{height:100%;border-radius:4px;transition:width .3s}
.rowacts{display:flex;gap:2px}
.rowacts button{width:26px;height:26px;border-radius:7px;font-size:12.5px;color:var(--muted);
  display:grid;place-items:center;transition:all .12s}
.rowacts button:hover{background:var(--surface-3);color:var(--ink)}
.rowacts button.del:hover{background:var(--rose-soft);color:var(--rose)}
.gfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}

.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.fbtn{padding:6px 13px;border-radius:20px;border:1px solid var(--hair);background:var(--surface);
  font-size:12.5px;color:var(--ink-2);transition:all .12s}
.fbtn:hover{border-color:var(--bronze)}
.fbtn.on{background:var(--bronze);color:var(--bronze-ink);border-color:var(--bronze);font-weight:600}

/* campanhas */
.camp{background:var(--surface);border:1px solid var(--hair-2);border-left:4px solid var(--muted);
  border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.camp.prio{background:linear-gradient(90deg,var(--rose-soft) 0%,var(--surface) 40%)}
.camp-n{font-size:14.5px;font-weight:660;letter-spacing:-.01em}
.camp-s{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:6px}
.camp-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:13px;
  padding-top:12px;border-top:1px solid var(--hair-2)}
.camp-l{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650;
  margin-bottom:3px;display:block}
.camp-v{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.fases{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.fase{flex:1;min-width:98px;background:var(--surface-2);border:1px solid var(--hair-2);border-radius:var(--r-sm);
  padding:8px 10px}
.fase.pass{opacity:.5}
.fase b{display:block;font-size:11.5px} .fase span{font-size:11px;color:var(--muted)}
.camp-a{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--hair-2)}
.camp-a select{padding:7px 10px;border:1px solid var(--hair);border-radius:9px;background:var(--surface-2);
  font-size:12.5px;outline:none;min-width:190px}
.camp-a select:focus{border-color:var(--bronze)}

/* calendar */
.cal{display:flex;flex-direction:column;gap:8px}

/* scorecard */

.field{margin-bottom:11px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--hair);
  border-radius:9px;background:var(--surface-2);outline:none;font-size:13.5px}
.field input,.field select{font-family:var(--font-num)}
.field textarea{font-family:var(--font-ui);resize:vertical;min-height:76px;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--bronze);background:var(--surface)}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--font-ui)}

  

  






 

/* templates */
.tpl{background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tplhead{display:flex;align-items:center;gap:11px;padding:12px 15px;cursor:pointer;user-select:none}
.tplhead:hover{background:var(--surface-2)}
.tplhead .k{width:25px;height:25px;border-radius:8px;background:var(--bronze-soft);color:var(--bronze);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;font-family:var(--font-num)}
.tplhead b{font-size:13.5px;font-weight:650}
.tplhead .when{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tplbody{display:none;padding:0 15px 15px;border-top:1px solid var(--hair-2)}
.tpl.open .tplbody{display:block}
.msg{background:var(--surface-2);border:1px solid var(--hair-2);border-radius:var(--r-sm);padding:14px;
  margin-top:12px;font-size:13px;line-height:1.65;white-space:pre-wrap}
.copy{margin-top:10px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:7px 13px;border-radius:18px;background:var(--bronze);color:var(--bronze-ink)}
.copy.done{background:var(--esm);color:#fff}
.note{margin-top:10px;font-size:12px;color:var(--ink-2);padding-left:11px;border-left:2px solid var(--bronze)}

/* timeline */
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:76px 1fr;gap:14px;position:relative;padding-bottom:15px}
.tli::before{content:"";position:absolute;left:76px;top:8px;bottom:-4px;width:1.5px;background:var(--hair)}
.tli:last-child::before{display:none}
.tld{font-family:var(--font-num);font-size:11.5px;font-weight:700;color:var(--bronze);text-align:right}
.tlc{padding-left:16px;position:relative}
.tlc::before{content:"";position:absolute;left:-4.5px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--surface);border:2px solid var(--bronze)}
.tli.hot .tlc::before{background:var(--rose);border-color:var(--rose)}
.tlc b{font-size:12.8px;display:block;margin-bottom:2px}
.tlc p{margin:0;font-size:12.5px;color:var(--ink-2)}

/* ===== APROVAÇÕES ===== */
.rev{display:grid;grid-template-columns:288px 1fr;gap:16px;align-items:start}
.queue{background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;position:sticky;top:112px;max-height:calc(100vh - 140px);
  display:flex;flex-direction:column}
.qhead{padding:11px 13px;border-bottom:1px solid var(--hair-2);background:var(--surface-2);
  font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650}
.qlist{overflow-y:auto}
.qi{display:flex;gap:10px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--hair-2);
  cursor:pointer;transition:background .12s;border-left:3px solid transparent}
.qi:hover{background:var(--surface-2)}
.qi.on{background:var(--bronze-soft);border-left-color:var(--bronze)}
.qi .av{width:32px;height:32px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;
  font-size:12px;font-weight:700;color:var(--bronze);flex:none;font-family:var(--font-brand)}
.qi b{display:block;font-size:12.8px;line-height:1.25}
.qi span{display:block;font-size:10.5px;color:var(--muted);font-family:var(--font-num)}
.qi .dot{width:8px;height:8px;border-radius:50%;margin-left:auto;flex:none}

.dossie{display:flex;flex-direction:column;gap:14px;min-width:0}
.dhero{background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r);
  box-shadow:var(--shadow);padding:20px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.dhero .big{width:56px;height:56px;border-radius:16px;background:var(--bronze);color:var(--bronze-ink);
  display:grid;place-items:center;font-family:var(--font-brand);font-size:23px;font-style:italic;flex:none}
.dhero h2{margin:0;font-size:22px;letter-spacing:-.02em;font-weight:680;line-height:1.15}
.dhero .hdl{font-family:var(--font-num);font-size:12.5px;color:var(--muted);margin-top:2px}
.dhero .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.dacts{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center}

.dbio{margin:7px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.5;max-width:60ch}
.dmeta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:9px;font-size:12px;color:var(--muted)}
.dmeta a{font-weight:600}
.marca{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--hair);
  border-radius:20px;padding:5px 13px;font-size:12.5px;font-weight:600}
.selos{background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r);
  box-shadow:var(--shadow);padding:14px 16px}
.selos-h{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:11px}
.selos-h b{font-size:13px}
.selos-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}
.selo{display:flex;gap:8px;align-items:center;font-size:12.3px;color:var(--ink-2);
  background:var(--surface-2);border-radius:var(--r-sm);padding:9px 11px;line-height:1.35}
.selo span{font-size:14px;flex:none}
.mkt-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:0}
.mkt-i{padding:16px 18px;border-right:1px solid var(--hair-2)}
.mkt-i:last-child{border-right:0}
.mkt-v{font-size:26px;font-weight:640;letter-spacing:-.03em;line-height:1.1;font-family:var(--font-num)}
.mkt-na{color:var(--muted);font-size:19px}
.mkt-l{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.35}
.mkt-p{font-size:11px;color:var(--muted);margin-top:2px}
@media(max-width:760px){.mkt-i{border-right:0;border-bottom:1px solid var(--hair-2)}}

.block{background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.bhead{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--hair-2);
  background:var(--surface-2)}
.bhead b{font-size:12.5px;font-weight:650}
.bhead .ct{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--font-num)}
.bbody{padding:16px}
.bbody p{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:break-word}
.bbody .empty{font-size:12.5px;color:var(--muted);font-style:italic}

.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.vid{display:block;background:var(--surface-2);border:1px solid var(--hair-2);border-radius:var(--r-sm);
  padding:12px;text-decoration:none;color:inherit;transition:all .14s}
.vid:hover{border-color:var(--bronze);transform:translateY(-1px);box-shadow:var(--shadow)}
.vid .thumb{height:74px;border-radius:7px;background:linear-gradient(135deg,var(--bronze-soft),var(--slate-soft));
  display:grid;place-items:center;font-size:22px;margin-bottom:9px}
.vid b{display:block;font-size:12.3px;line-height:1.3}
.vid span{display:block;font-size:10.5px;color:var(--muted);font-family:var(--font-num);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.decision{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:16px;background:var(--surface-2);
  border-radius:var(--r);border:1px solid var(--hair-2)}
.decision .lb{font-size:12.5px;font-weight:600;margin-right:auto}
.verd{padding:14px 16px;border-radius:var(--r);display:flex;gap:11px;align-items:flex-start}
.verd.ap{background:var(--esm-soft)} .verd.rp{background:var(--rose-soft)} .verd.dd{background:var(--amber-soft)}
.verd b{font-size:13px;display:block} .verd p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2)}

/* radar de acompanhamento */
.rc{background:var(--surface);border:1px solid var(--hair-2);border-left:4px solid var(--muted);
  border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.rc-s{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:5px}
.rc-w{margin:10px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.rc-a{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-top:11px;padding:11px 13px;
  background:var(--surface-2);border-radius:var(--r-sm)}
.rc-ai{color:var(--bronze);font-weight:700;font-size:14px;flex:none}
.rc-a b{font-size:13px;display:block;line-height:1.45}
.rc-t{font-size:11.5px;color:var(--muted);margin-top:3px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(30,24,18,.5);backdrop-filter:blur(3px);z-index:60;display:none}
.scrim.on{display:block}
.modal{position:fixed;inset:0;z-index:61;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.vintro{margin:0 0 16px;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
#vmodal .mfoot{flex-wrap:wrap}
.mbox{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:min(720px,100%);
  max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--hair)}
.mhead{padding:18px 22px 15px;border-bottom:1px solid var(--hair-2);display:flex;align-items:center;gap:12px}
.mhead h3{margin:0;font-size:17px;letter-spacing:-.01em;font-weight:660}
.mbody{padding:18px 22px;overflow-y:auto;flex:1}
.mfoot{padding:14px 22px;border-top:1px solid var(--hair-2);display:flex;gap:9px;justify-content:flex-end;
  background:var(--surface-2);border-radius:0 0 18px 18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fgrid .full{grid-column:1/-1}
.fsec{grid-column:1/-1;margin:14px 0 9px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--bronze);font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--hair-2)}
.fsec:first-child{margin-top:0}
.imp{grid-column:1/-1;background:var(--surface-2);border:1px solid var(--hair);border-radius:var(--r);
  padding:14px 15px;margin-bottom:14px}
.imp .row{display:flex;gap:8px;align-items:stretch}
.imp .row input{flex:1;padding:9px 11px;border:1px solid var(--hair);border-radius:9px;
  background:var(--surface);outline:none;font-size:13px;font-family:var(--font-num)}
.imp .row input:focus{border-color:var(--bronze)}
.imp textarea{width:100%;padding:10px 11px;border:1px solid var(--hair);border-radius:9px;
  background:var(--surface);outline:none;font-size:12.5px;min-height:88px;resize:vertical;
  font-family:var(--font-ui);line-height:1.5}
.imp textarea:focus{border-color:var(--bronze)}
.imp label{display:block;font-size:11.5px;font-weight:650;color:var(--ink-2);margin-bottom:5px}
.imp .hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.found{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.found .fi{display:flex;gap:8px;align-items:center;font-size:12px;padding:5px 9px;border-radius:7px;
  background:var(--surface)}
.found .fi b{margin-left:auto;font-family:var(--font-num);font-weight:650}
.found .fi.ok{color:var(--esm)} .found .fi.warn{color:var(--amber)}

.vrow{display:flex;gap:8px;margin-bottom:8px}
.vrow input{flex:1}
.vrow button{width:36px;border-radius:9px;border:1px solid var(--hair);background:var(--surface-2);
  color:var(--rose);font-size:15px;flex:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);
  color:var(--sand);padding:11px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:80;
  box-shadow:var(--shadow-lg);transition:transform .28s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0)}

@media(max-width:1080px){.rev{grid-template-columns:1fr}.queue{position:static;max-height:340px}}
.burger{display:none}
@media(max-width:640px){.hide-sm{display:none}}
@media(max-width:980px){
  .app{grid-template-columns:1fr}
  .burger{display:grid}
  .side{position:fixed;inset:0 auto 0 0;width:258px;z-index:70;transform:translateX(-100%);
    transition:transform .24s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg)}
  body.navopen .side{transform:none}
  body.navopen::after{content:"";position:fixed;inset:0;background:rgba(30,24,18,.45);z-index:69}
  .fgrid,.cock{grid-template-columns:1fr}
  .wrap,.top{padding-left:15px;padding-right:15px}
  .search{min-width:0;flex:1} .toprow{gap:9px}
}
@media(max-width:520px){
  .tiles{grid-template-columns:1fr 1fr}
  .nact{width:100%;justify-content:flex-start;margin-top:9px}
  .prox,.notif{flex-wrap:wrap}
  .hoje .btn{margin-left:0;width:100%;justify-content:center}
  .dhero{flex-direction:column} .dacts{margin-left:0;width:100%}
}
/* imprimir a ficha para levar à reunião */
@media print{
  .side,.top,.dacts,.decision,.qfilt,.filters,.gbar,.bulk,.gfoot,.toast,.tiles{display:none!important}
  .app{grid-template-columns:1fr} .wrap{padding:0;max-width:none}
  .view{display:none!important} .view.on{display:block!important}
  .block,.card,.dhero,.selos,.rc{box-shadow:none;break-inside:avoid;border-color:#bbb}
  .cock{grid-template-columns:1fr} body{background:#fff}
}

/* termo de parceria (Conexão Creators) */
.termo-b{background:var(--surface);border:1px solid var(--hair-2);border-left:4px solid var(--slate);
  border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:14px;
  align-items:flex-start;flex-wrap:wrap}
.termo-b.ok{border-left-color:var(--esm)} .termo-b.pend{border-left-color:var(--amber)}
.termo-b .ti{flex:1;min-width:220px}
.termo-b .ti b{display:block;font-size:13.5px}
.termo-b .ti p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.termo-b .ta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.termo-b .ta .btn{text-decoration:none}
.termo-l{margin:9px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.termo-l li{font-size:12.3px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.termo-l li b{font-size:12.3px;color:var(--ink)}
.termo-l .num{color:var(--muted)}

/* hospedagem em destaque na ficha */
.hosp{display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--hair-2);border-left:4px solid var(--bronze);border-radius:var(--r);
  box-shadow:var(--shadow);padding:15px 18px}
.hosp.vazio{border-left-color:var(--amber);gap:13px}
.hosp.vazio b{font-size:13.5px;display:block} .hosp.vazio p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2)}
.hosp-ic{font-size:19px}
.hosp-i{display:flex;flex-direction:column;gap:1px}
.hosp-l{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650}
.hosp-i b{font-size:17px;font-weight:660;letter-spacing:-.02em;line-height:1.2}
.hosp-i small{font-size:11px;color:var(--muted)}
.hosp-i.perto b{color:var(--rose)} .hosp-i.pass{opacity:.5}
.hosp-ar{color:var(--bronze);font-size:17px;font-weight:700}

/* foto no formulário */
.fotobox{display:flex;gap:14px;align-items:flex-start}
.fotoprev{width:74px;height:74px;border-radius:18px;background:var(--surface-3);flex:none;
  display:grid;place-items:center;font-family:var(--font-brand);font-size:22px;color:var(--bronze);
  overflow:hidden;border:1px solid var(--hair)}
.fotoprev img{width:100%;height:100%;object-fit:cover}

/* cards do funil */
.ctop{display:flex;gap:9px;align-items:center}
.cav{width:32px;height:32px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface-3)}
.cav.ini{display:grid;place-items:center;font-family:var(--font-brand);font-size:11.5px;
  color:var(--bronze);font-weight:700}
.ccard{cursor:grab}
.ccard:active{cursor:grabbing}
.ccard.dragging{opacity:.4;transform:rotate(1.5deg) scale(.98)}
.colbody.over{background:var(--bronze-soft);outline:2px dashed var(--bronze);outline-offset:-5px;border-radius:9px}

/* cartão de aprovação */
.cartao{background:var(--surface);border:1px solid var(--hair-2);border-radius:18px;
  box-shadow:var(--shadow);overflow:hidden}
.cartao.previa{box-shadow:none}
.ct-h{display:flex;gap:14px;align-items:center;padding:20px}
.ct-foto{width:76px;height:76px;border-radius:22px;object-fit:cover;flex:none;background:var(--surface-3)}
.ct-foto.ini{display:grid;place-items:center;font-family:var(--font-brand);font-size:26px;
  font-style:italic;color:var(--bronze)}
.ct-n{font-size:20px;font-weight:680;letter-spacing:-.02em;line-height:1.15}
.ct-h2{font-family:var(--font-num);font-size:12.5px;color:var(--muted);margin-top:2px}
.ct-link{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:600}
.ct-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;
  background:var(--hair-2);border-top:1px solid var(--hair-2);border-bottom:1px solid var(--hair-2)}
.ct-nums>div{background:var(--surface);padding:13px 14px}
.ct-nums b{display:block;font-size:19px;font-weight:670;letter-spacing:-.02em;font-family:var(--font-num)}
.ct-nums span{font-size:10.5px;color:var(--muted)}
.ct-hosp{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:14px;
  padding:17px 20px;background:var(--bronze-soft)}
.ct-hosp span{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--bronze);font-weight:700}
.ct-hosp b{display:block;font-size:15px;font-weight:660;margin-top:3px;line-height:1.2}
.ct-hosp small{font-size:10.5px;color:var(--muted)}
.ct-prazo{padding:9px 20px;background:var(--amber-soft);color:var(--amber);font-size:12.5px;font-weight:600}
.ct-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px;padding:17px 20px}
.ct-info span{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:650}
.ct-info b{display:block;font-size:12.8px;font-weight:550;margin-top:2px;line-height:1.4}
.ct-bloco{padding:15px 20px;border-top:1px solid var(--hair-2)}
.ct-bloco h4{margin:0 0 6px;font-size:11.5px;font-weight:700}
.ct-bloco p{margin:0;font-size:13px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap}
.ct-vids{display:flex;flex-direction:column;gap:6px}
.ct-vids a{font-size:12.5px;padding:8px 11px;background:var(--surface-2);border-radius:9px;
  text-decoration:none;border:1px solid var(--hair-2)}
.ct-vids a:hover{border-color:var(--bronze)}

.apv-img,.envio-img{border-radius:20px;overflow:hidden;background:#0C4A3C;
  box-shadow:var(--shadow-lg);line-height:0}
.apv-img img,.envio-img img{width:100%;height:auto;display:block}
.envio-img{max-width:230px;margin:0 auto;max-height:250px;overflow:hidden;border-radius:12px;
  position:relative;box-shadow:var(--shadow)}
.envio-img::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;
  background:linear-gradient(transparent,var(--surface))}
.apv-load{padding:70px 20px;text-align:center;color:rgba(255,248,238,.7);font-size:13px;line-height:1.5}
.apv-mais{margin-top:13px;font-size:12.5px;color:var(--bronze);font-weight:600}

/* tela do supervisor */
#aprovaView{min-height:100vh;background:var(--sand);padding:22px 16px 50px}
.apv-top{display:flex;gap:12px;align-items:center}
.apv-top b{display:block;font-family:var(--font-brand);font-size:17px;font-weight:600}
.apv-top span{display:block;font-size:11.5px;color:var(--muted)}
.apv-dec{background:var(--surface);border:1px solid var(--hair-2);border-radius:18px;

/* fila lateral */

.papeis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:13px;

/* ============================================================
   ACABAMENTO — menos caixa, mais respiro.

.card,.block,.kpi,.tile,.rc,.camp,.trilha,.queue,.tw,.alert,.selos,.papel,

/* cabecalhos de bloco menos pesados */

.bbody{padding:18px}
.qhead{background:none;border-bottom:1px solid var(--fio)}
.colhead{border-bottom:1px solid var(--fio)}

.tw{border-radius:12px}

/* junta o que está na página com o que está neste navegador.
   Para cada creator vence a versão mexida por último. */
function mesclar(base,local){
  const mapa=new Map();
  (base||[]).forEach(c=>mapa.set(String(c.id),c));
  (local||[]).forEach(c=>{
    const k=String(c.id), a=mapa.get(k);
    if(!a){mapa.set(k,c);return}
    const ta=a.alterado||a.criado||"", tb=c.alterado||c.criado||"";
    if(tb>=ta)mapa.set(k,c);
  });
  return [...mapa.values()];
}

function textoParaLista(s,max){
  return String(s||"").split(/[·|;\n]+/).map(t=>t.trim()).filter(Boolean).map(t=>{
    const m=t.match(/^(.+?)\s*[:=]\s*([\d,.]+)\s*%?$/); if(!m)return null;

  }).filter(Boolean).slice(0,max||5);
}

/* Lê o texto copiado de um print de insights e devolve os campos que reconheceu */
function parseInsights(txt){
  const t=txt.replace(/ /g," ");
  const out={}, achou=[];

  const U="(mil|mi|milh[õo]es?|k)?";
  /* seguidores — cobre "160,1 mil / Total de seguidores" do Marketplace */
  let m=t.match(new RegExp("([\\d.,]+)\\s*"+U+"\\s*(?:total de\\s+)?seguidores(?!\\s*no\\b)","i"))
      || t.match(new RegExp("seguidores[^\\d%]{0,14}?([\\d.,]+)\\s*"+U+"\\b(?!\\s*%)","i"))
      || t.match(new RegExp("\\btotal\\b[^\\d%]{0,14}([\\d.,]+)\\s*"+U+"(?!\\s*%)","i"));
  if(m){const v=pnum(m[1]);if(v){out.seg=Math.round(v*mult(m[2]));achou.push(["Seguidores",fmt(out.seg),"ok"])}}

  /* bloco do Meta Creator Marketplace */
  m=t.match(new RegExp("([\\d.,]+)\\s*"+U+"\\s*intera[çc][õo]es","i"));
  if(m){out.inter=Math.round(pnum(m[1])*mult(m[2]));achou.push(["Interações · 30d",curto(out.inter),"ok"])}
  m=t.match(new RegExp("([\\d.,]+)\\s*"+U+"\\s*(?:total de\\s+)?visualiza[çc][õo]es","i"));
  if(m){out.views=Math.round(pnum(m[1])*mult(m[2]));achou.push(["Visualizações · 30d",curto(out.views),"ok"])}
  m=t.match(/([\d,]+)\s*%\s*taxa de intera[çc][ãa]o/i)||t.match(/taxa de intera[çc][ãa]o[^\d]{0,20}([\d,]+)\s*%/i);
  if(m){out.txint=pnum(m[1]);achou.push(["Taxa de interação",String(out.txint).replace(".",",")+"%","ok"])}
  m=t.match(/([\d,]+)\s*%\s*taxa de aten[çc][ãa]o/i)||t.match(/taxa de aten[çc][ãa]o[^\d]{0,26}([\d,]+)\s*%/i);
  if(m){out.txaten=pnum(m[1]);achou.push(["Taxa de atenção inicial",String(out.txaten).replace(".",",")+"%","ok"])}
  m=t.match(/faixa et[áa]ria de\s*(\d{2})\s*a\s*(\d{2})/i);
  if(m){out.pub=m[1]+"-"+m[2];achou.push(["Faixa etária",out.pub,"ok"])}
  const marcas=[...t.matchAll(/em parceria com\s+([^\n·|]{2,42})/gi)].map(x=>x[1].trim()).filter(Boolean);
  if(marcas.length){out.marcas=[...new Set(marcas)].join(", ");achou.push(["Parcerias anteriores",out.marcas,"ok"])}
  if(/predicted high ad performance|performance alta|alto n[íi]vel|high level/i.test(t)){
    out.pred="alta";achou.push(["Previsão de performance","alta","ok"])}
  const selos=SELOS.filter(s=>t.toLowerCase().includes(s.toLowerCase().slice(0,22)));
  if(selos.length){out.selos=selos;achou.push(["Selos de destaque",selos.length+" de 4","ok"])}

  /* gênero */
  m=t.match(/(?:mulheres|feminino)[^\d]{0,20}([\d,]+)\s*%/i)||t.match(/([\d,]+)\s*%[^\n]{0,14}(?:mulheres|feminino)/i);
  if(m){out.fem=Math.round(pnum(m[1]));achou.push(["Público feminino",out.fem+"%","ok"])}
  else{m=t.match(/(?:homens|masculino)[^\d]{0,20}([\d,]+)\s*%/i);
    if(m){out.fem=Math.round(100-pnum(m[1]));achou.push(["Público feminino","≈"+out.fem+"% (a partir de homens)","warn"])}}

  /* faixas etárias — o Meta escreve "25 a 34", outros lugares usam "25-34" */
  const faixas=[]; let fx;
  const rxF=/(\d{2})\s*(?:a|à|-|–|—|até)\s*(\d{2})[^\d%]{0,26}?([\d,]+)\s*%/gi;
  while((fx=rxF.exec(t))!==null)faixas.push({r:fx[1]+" a "+fx[2],p:pnum(fx[3])});
  const r65=t.match(/65\s*\+[^\d%]{0,26}?([\d,]+)\s*%/);
  if(r65)faixas.push({r:"65+",p:pnum(r65[1])});
  if(faixas.length){
    out.faixas=faixas.sort((a,b)=>b.p-a.p).slice(0,3);
    achou.push(["Faixas etárias",out.faixas.map(x=>x.r).join(", "),"ok"]);
    const alvo=faixas.filter(x=>/^(25|35|45)/.test(x.r)).reduce((s,x)=>s+x.p,0);
    if(alvo>0)out.idade=Math.round(alvo);
  }

  /* principais cidades */
  const cid=[]; let cm;
  const rxC=/([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'.\- ]{2,28}),\s*([A-Z]{2})\b[^\d%]{0,26}?([\d,]+)\s*%/g;
  while((cm=rxC.exec(t))!==null)cid.push({r:cm[1].trim()+", "+cm[2],p:pnum(cm[3])});
  if(cid.length){
    out.cidades=cid.sort((a,b)=>b.p-a.p).slice(0,2);
    achou.push(["Principais cidades",out.cidades.map(x=>x.r).join(" e "),"ok"]);
  }


  /* métricas de conteúdo */
  m=t.match(/engajament\w*[^\d]{0,24}?([\d,]+)\s*%/i);
  if(m){out.eng=pnum(m[1]);achou.push(["Engajamento",String(out.eng).replace(".",",")+"%","ok"])}
  m=t.match(/alcance[^\d]{0,24}?([\d.,]+)\s*(mil|mi|m|k)?/i);
  if(m){const v=pnum(m[1]);if(v){out.alc=Math.round(v*mult(m[2]));achou.push(["Alcance médio",fmt(out.alc),"ok"])}}
  m=t.match(/curtidas[^\d]{0,24}?([\d.,]+)\s*(mil|mi|m|k)?/i);
  if(m&&out.seg&&out.eng==null){const v=pnum(m[1])*mult(m[2]);
    out.eng=Math.round(v/out.seg*10000)/100;
    achou.push(["Engajamento","≈"+String(out.eng).replace(".",",")+"% (curtidas ÷ seguidores)","warn"])}

  return {out,achou};
}

/* notificações derivadas do estado real — somem sozinhas quando você resolve */
function notificacoes(){
  const N=[];
  CAMP.filter(c=>days(c.dt)>=0&&doCamp(c.id).length<(c.vagas||1)).forEach(c=>{
    const s=campStatus(c);
    if(s.dFec<0)N.push({sev:"crit",ic:"🔥",t:c.n+(c.vagas>1?" com vaga aberta":" sem creator"),
      d:"O prazo de fechar contrato passou há "+(-s.dFec)+" dias. O evento é em "+s.dEvt+" dias.",go:"calendario"});
    else if(s.dFec<=21)N.push({sev:"warn",ic:"📌",t:c.n+(c.vagas>1?" com vaga aberta":" sem creator"),
      d:"Faltam "+s.dFec+" dias para o prazo de fechar contrato.",go:"calendario"});
  });
  DB.map(c=>({c,r:radar(c)})).forEach(({c,r})=>{
    if(r.sev==="chega")N.push({sev:"info",ic:"✈️",t:c.n+" chega em "+r.chk+" dias",
      d:r.act,cid:c.id,tpl:r.tpl});
    else if(r.sev==="atras"&&c.st==="hospedado")N.push({sev:"crit",ic:"🎬",t:"Entrega de "+c.n+" travada",
      d:r.why+" "+r.act,cid:c.id,tpl:r.tpl});
  });
  RESP.filter(r=>!r.lida).forEach(r=>{
    const d=DECS[r.d]||{n:r.d,ic:"\u2022"};
    N.push({sev:r.d==="reprovado"?"crit":r.d==="duvida"?"warn":"info",ic:d.ic,
      t:"Supervisor: "+d.n+" \u00b7 "+r.n,
      d:(r.t?'\u201c'+r.t+'\u201d':"Sem comentario.")+"  \u00b7  "+fmtD(r.q),
      cid:r.cid,resp:r.chave});
  });
  const pend=DB.filter(c=>c.ap==="pendente").length;
  if(pend)N.push({sev:"warn",ic:"✓",t:pend+" ficha(s) esperando aprovação",
    d:"Ninguém decidiu se entram ou não no funil.",go:"aprovacao"});
  const semDado=DB.filter(c=>c.g!=="C"&&c.seg==null).length;
  if(semDado)N.push({sev:"info",ic:"📊",t:semDado+" creator(s) sem nenhum número",
    d:"Sem seguidores nem alcance, a permuta vira aposta. Peça o mídia kit.",go:"base"});
  const ord={crit:0,warn:1,info:2};
  return N.sort((a,b)=>ord[a.sev]-ord[b.sev]);
}
function ultimasInteracoes(n){
  const out=[];
  DB.forEach(c=>(c.hist||[]).forEach(h=>out.push({c,d:h.d,t:h.t})));
  return out.sort((a,b)=>b.d.localeCompare(a.d)).slice(0,n);
}

async function remover(ids){
  const nomes=ids.map(id=>{const c=DB.find(x=>x.id===id);return c?c.n:""}).filter(Boolean);
  const m=await ask({title:ids.length>1?"Remover "+ids.length+" creators":"Remover "+nomes[0],
    msg:"Apaga a ficha inteira: insights, big ideia, vídeos e histórico. Não dá para desfazer — se for só parar de trabalhar com ele, use Suspender.",
    label:"Confirme digitando REMOVER",ok:"🗑 Remover da base",tone:"no",value:"",
    ph:"REMOVER",hint:nomes.slice(0,6).join(", ")+(nomes.length>6?" e mais "+(nomes.length-6):"")});
  if(m===null)return;
  if(m.trim().toUpperCase()!=="REMOVER"){toast("Digite REMOVER para confirmar");return}
  DB=DB.filter(c=>!ids.includes(c.id));
  Object.keys(ALOC).forEach(k=>{ALOC[k]=(ALOC[k]||[]).filter(x=>!ids.includes(x));if(!ALOC[k].length)delete ALOC[k]});

/* ---------- termo de parceria (Conexão Creators) ---------- */
/* O guia + termo assinável vivem no site do hotel; a ficha daqui gera a campanha lá com um clique
   (#nova=) e recebe de volta as assinaturas pelo link #termo= que a área da equipe devolve. */
const CONEXAO={admin:"https://creators.187-127-26-180.nip.io/admin/",base:"https://creators.187-127-26-180.nip.io/"};
const slugTermo=c=>{
  const nome=String(c.n||"creator").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")||"creator";
  return nome+"-"+(c.checkin?c.checkin.slice(0,7):new Date().toISOString().slice(0,7));
};
const dBR=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4):"";
function payloadTermo(c){
  const nt=noites(c.checkin,c.checkout);
  const ad=c.pax!=null&&c.criancas!=null?Math.max(0,c.pax-c.criancas):c.pax;
  const hosp=c.pax==null?"":(c.criancas?`${ad} adulto${ad===1?"":"s"} e ${c.criancas} criança${c.criancas===1?"":"s"}`
    +(c.idades?` (${c.idades})`:""):`${c.pax} adulto${c.pax===1?"":"s"}`);
  return {slug:(c.termo&&c.termo.slug)||slugTermo(c),n:c.n,h:c.h,u:c.url,em:c.email,zp:c.whats,
    ci:dBR(c.checkin),co:dBR(c.checkout),nt:nt!=null?String(nt):"",px:hosp,pen:c.pensao||"",qt:c.quarto||"",
    pm:c.permuta!=null?Number(c.permuta).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}):"",
    tr:c.tier||"",ac:c.acomp||"",ob:c.obsRes||"",de:MEU.nome||""};
}
function termoBloco(c){
  const t=c.termo, ass=(t&&t.assinaturas)||[];
  const linkNova=CONEXAO.admin+"#nova="+B64E(payloadTermo(c));
  if(!t) return `<div class="termo-b"><span class="hosp-ic">✍️</span>
    <div class="ti"><b>Termo de parceria ainda não gerado</b>
      <p>Gera a campanha no Conexão Creators com os dados desta ficha (datas, hóspedes, regime, permuta). Lá você completa o que falta e o creator assina pelo celular.</p></div>

      <span class="num">${esc(a.quando||"")}</span><span class="num">protocolo ${esc(a.prot||"—")}</span></li>`).join("")}</ul>`:"";
  return `<div class="termo-b ${cre?"ok":"pend"}"><span class="hosp-ic">${cre?"✅":"✍️"}</span>
    <div class="ti"><b>${cre?"Termo de parceria assinado":"Termo de parceria aguardando assinatura"}</b>
      <p>Campanha <b style="font-family:var(--font-num)">${esc(t.slug)}</b>${t.gerado?` · gerada em ${fmtD(t.gerado)}`:""}${
        cre?"":". Manda o link do guia + login e senha (criados na área da equipe) pro creator; a assinatura chega aqui pelo botão “Enviar pro EsmCreators”."}</p>${lista}</div>
    <div class="ta">
      ${t.guia?`<button class="btn ghost sm" type="button" data-act="termo-guia" data-cid="${c.id}">⧉ Link do guia</button>`:""}
      <a class="btn ghost sm" href="${esc(CONEXAO.admin+"#campanha="+encodeURIComponent(t.slug))}" target="_blank" rel="noopener">⚙ Área da equipe ↗</a>
      <a class="btn ghost sm" href="${esc(linkNova)}" target="_blank" rel="noopener" data-act="termo-gerar" data-cid="${c.id}" title="Reenvia os dados da ficha para a campanha">↻ Reenviar dados</a>
    </div></div>`;
}
/* chega pelo link #termo= que a área da equipe devolve: registra as assinaturas na ficha */
function receberTermo(r){
  if(!r||!r.slug)return false;
  const c=DB.find(x=>x.termo&&x.termo.slug===r.slug)
        ||(r.h&&r.h!=="\u2014"&&DB.find(x=>x.h&&x.h.toLowerCase()===String(r.h).toLowerCase()))
        ||(r.n&&DB.find(x=>x.n.toLowerCase()===String(r.n).toLowerCase()))||null;
  if(!c)return false;
  c.termo=Object.assign({assinaturas:[]},c.termo||{},{slug:r.slug});
  if(r.guia)c.termo.guia=r.guia;
  const hoje=new Date().toISOString().slice(0,10);
  let novas=0;
  (r.ass||[]).forEach(a=>{
    if(!a||!a.prot||c.termo.assinaturas.some(x=>x.prot===a.prot))return;
    c.termo.assinaturas.push({nome:a.nome||"",papel:a.papel||"creator",quando:a.quando||"",prot:a.prot,pdf:a.pdf||""});
    c.hist=c.hist||[];
    if(!c.hist.some(h=>h.t&&h.t.indexOf("protocolo "+a.prot)>=0))
      c.hist.push({d:(a.quando||hoje).slice(0,10).split(" ")[0].split("/").length===3?(function(q){var p=q.split(" ")[0].split("/");return p[2]+"-"+p[1]+"-"+p[0]})(a.quando):(a.quando||hoje).slice(0,10),t:"Termo de parceria assinado por "+(a.nome||"?")+
      (a.papel==="collab"?" (collab)":"")+" — protocolo "+a.prot});
    novas++;
  });
  if(novas){
    const cre=c.termo.assinaturas.some(a=>a.papel==="creator");
    const idx=STAGES.findIndex(s=>s.id===c.st), idxF=STAGES.findIndex(s=>s.id==="fechado");
    if(cre&&idx>=0&&idx<idxF){c.st="fechado";c.hist.push({d:hoje,t:"Etapa alterada: "+stage("termo").n+" → "+stage("fechado").n+" (termo assinado)"})}
    c.ult=hoje; touch(c); save();
  }
  return novas>0;
}

const addD=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
/* sequência precisa do creator antes do esquenta; pontual, 30 dias. `lead` sobrescreve por campanha */
const prazoFechar=c=>addD(c.dt,-(c.lead||(c.tipo==="sequencia"?45:30)));

function campStatus(c){
  const dEvt=days(c.dt), dFec=days(prazoFechar(c)), aloc=doCamp(c.id);
  if(dEvt<0)return{s:"fim",t:"Já aconteceu",dEvt,dFec,aloc};
  const vg=c.vagas||1;
  if(aloc.length>=vg)return{s:"ok",t:aloc.length+" de "+vg+" definido"+(vg>1?"s":""),dEvt,dFec,aloc};
  if(aloc.length)return{s:"atencao",t:aloc.length+" de "+vg+" definidos · falta "+(vg-aloc.length),dEvt,dFec,aloc};
  if(dFec<0)return{s:"atras",t:"Prazo de fechar estourou há "+(-dFec)+" dias",dEvt,dFec,aloc};
  if(dFec<=14)return{s:"atras",t:"Fechar em "+dFec+" dias",dEvt,dFec,aloc};
  if(dFec<=30)return{s:"atencao",t:"Fechar em "+dFec+" dias",dEvt,dFec,aloc};
  return{s:"ok",t:"Fechar até "+fmtD(prazoFechar(c)),dEvt,dFec,aloc};
}

/* ================= MOTOR DE ACOMPANHAMENTO ================= */
const HOJE=()=>new Date(new Date().toISOString().slice(0,10)+"T12:00:00");
const dSince=iso=>iso?Math.floor((HOJE()-new Date(iso+"T12:00:00"))/864e5):null;
const agora=()=>new Date().toISOString();
/* carimba a última alteração — usado por tudo que muda uma ficha */
const touch=c=>{if(c){c.alterado=agora();if(!c.criado)c.criado=c.alterado}return c};
const touchAll=ids=>ids.forEach(i=>touch(DB.find(x=>x.id===i)));
function fmtDT(iso){if(!iso)return "—";const d=new Date(iso);
  const hoje=new Date(),ontem=new Date(Date.now()-864e5);
  const mesmo=(a,b)=>a.toDateString()===b.toDateString();
  const hm=d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  if(mesmo(d,hoje))return "hoje "+hm;
  if(mesmo(d,ontem))return "ontem "+hm;
  const dias=Math.floor((hoje-d)/864e5);
  if(dias<7)return dias+" dias atrás";
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})+
    (d.getFullYear()!==hoje.getFullYear()?"/"+String(d.getFullYear()).slice(2):"")}
const fmtD=iso=>iso?new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}):"—";
const MESDT={"Set/26":"2026-09-01","Out/26":"2026-10-01","Nov/26":"2026-11-01","Dez/26":"2026-12-01",
 "Jan/27":"2027-01-01","Fev/27":"2027-02-01","Mar/27":"2027-03-01","Abr/27":"2027-04-01",
 "Mai/27":"2027-05-01","Jun/27":"2027-06-01","Jul/27":"2027-07-01","Ago/27":"2027-08-01"};
const SEV={atras:{n:"Atrasado",c:"var(--rose)",p:"p-rose",i:"🔴"},
 atencao:{n:"Aja esta semana",c:"var(--amber)",p:"p-amber",i:"🟠"},
 chega:{n:"Chegando",c:"var(--bronze)",p:"p-bronze",i:"✈️"},
 ok:{n:"Em dia",c:"var(--esm)",p:"p-esm",i:"🟢"},
 susp:{n:"Suspenso",c:"var(--muted)",p:"p-mute",i:"⏸"},
 fim:{n:"Arquivado",c:"var(--slate)",p:"p-slate",i:"✓"}};

/* Devolve o diagnóstico e a próxima ação de UM creator */
function radar(c){
  const d=dSince(c.ult), chk=c.checkin?-dSince(c.checkin):null;
  const R=(sev,t,why,act,tpl,extra)=>({sev,t,why,act,tpl,d,chk,...extra});

  if(c.sit==="suspenso"){
    const falta=d!=null?90-d:null;
    return R("susp","Suspenso há "+(d??"?")+" dias",
      c.sitm||"Sem justificativa registrada — preencha para o histórico fazer sentido.",
      falta!=null&&falta<=0?"Já pode reabrir. Volte com pauta nova, não com cobrança.":`Reabrir em ${falta} dias com uma pauta nova`,5);
  }
  if(c.st==="concluido") return R("fim","Ciclo concluído","Parceria entregue e medida.",
    "Avaliar repeteco na próxima temporada. Se as métricas foram boas, ele volta em Tier 1.",null);
  if(c.st==="perdido") return R("fim",c.ap==="reprovado"?"Reprovado":"Perdido",
    c.apm||"Fora do funil ativo.",
    "Arquivado. Só reabra com uma pauta nova — feriado, campanha ou evento.",5);

  /* hospedado: relógio da entrega */
  if(c.st==="hospedado"){
    const e=d??0;
    if(e<3) return R("ok","Hospedado há "+e+" dias","Dentro do prazo de edição combinado no check-out.",
      "Nada a fazer. O primeiro toque é no D+3.",null);
    if(e<=5) return R("atencao","Entrega vence agora","Passaram "+e+" dias desde o check-out.",
      "Cobrar o reels editado para aprovação.",10);
    if(e<=10) return R("atras","Reels atrasado","Sem entrega há "+e+" dias.",
      "Ligar. Texto já não está resolvendo.",10);
    return R("atras","Entrega travada há "+e+" dias","O contrato prevê prazo de entrega.",
      "Escalar por e-mail citando o prazo contratual e a data combinada no check-out.",10);
  }

  /* fechado: relógio da chegada */
  if(c.st==="fechado"&&chk!=null){
    if(chk<0) return R("atras","Check-in era "+fmtD(c.checkin),"A data já passou e ele continua como Fechado.",
      "Mover para Hospedado e travar os prazos de entrega por escrito.",10);
    if(chk<=2) return R("chega","Chega em "+chk+(chk===1?" dia":" dias"),"Semana da chegada — hoje é o toque de boas-vindas.",
      "Enviar boas-vindas: horário de check-in, nome e telefone de quem recebe, tabela de horários do hotel.",9);
    if(chk<=7) return R("chega","Chega em "+chk+" dias","Está a uma semana de vir.",
      "Enviar o kit, confirmar voo e horário de chegada, e adiantar como vai funcionar: recreação, jantar temático do dia, horário do ensaio com o marketing.",9);
    if(chk<=15) return R("atencao","Chega em "+chk+" dias","Janela do briefing (D-15).",
      "Enviar briefing com a pauta dos reels, a tabela de horários e o que precisa ser gravado em cada momento.",6);
    if(chk<=30) return R((c.termo&&(c.termo.assinaturas||[]).some(a=>a.papel==="creator"))?"ok":"atencao","Chega em "+chk+" dias","Janela do contrato (D-30).",
      (c.termo&&(c.termo.assinaturas||[]).some(a=>a.papel==="creator"))?"Contrato assinado e data bloqueada em Reservas."
        :"Gerar o termo no Conexão Creators (bloco da ficha) e mandar o link do guia pra ele assinar.",null);
    return R("ok","Chega em "+chk+" dias","Agendado e sob controle.","Nada agora. O briefing sai no D-15.",null);
  }

  /* nunca contatado */
  if(!c.ult){
    const alvo=MESDT[c.mes], falta=alvo?days(alvo):null;
    if(falta!=null&&falta<=75) return R("atras","Nunca contatado","Mês previsto é "+c.mes+", daqui a "+falta+" dias. Contrato precisa fechar ~45 dias antes.",
      "Enviar o primeiro contato hoje. Citar um post real dele.",0);
    return R("atencao","Nunca contatado","Aprovado na triagem e parado na fila.",
      "Enviar o primeiro contato. Citar um post real dele.",0);
  }

  /* prospecção e negociação */
  const st=c.st;
  if(st==="prospectar"||st==="contato"){
    if(d<=2) return R("ok","Contato há "+d+(d===1?" dia":" dias"),"Dentro da janela de resposta.","Aguardar até o D+3.",null);
    if(d<=7) return R("atencao","Sem resposta há "+d+" dias","Passou do D+3.",
      "Follow-up 1 — curto, e troque o canal: se foi DM, vai de e-mail.",2);
    if(d<=14) return R("atencao","Sem resposta há "+d+" dias","Passou do D+8.",
      "Follow-up 2 — com gancho novo: uma data aberta, um feriado, uma campanha.",3);
    if(d<=25) return R("atras","Sem resposta há "+d+" dias","Passou do D+15.",
      "Última tentativa. Encerramento educado — é a mensagem que mais converte.",4);
    return R("atras","Abandonado há "+d+" dias","Três tentativas já deveriam ter acontecido.",
      "Suspender e congelar por 90 dias, ou justificar por que ainda está aberto.",4,{sug:"suspender"});
  }
  if(st==="conversa"){
    if(d<=3) return R("ok","Em conversa há "+d+(d===1?" dia":" dias"),"Negociação quente.","Enviar a proposta em até 24h da resposta dele.",6);
    if(d<=7) return R("atencao","Conversa parada há "+d+" dias","Ele respondeu e a proposta não saiu.",
      "Enviar a proposta hoje, com data de retorno definida.",6);
    return R("atras","Conversa esfriando há "+d+" dias","Passou de uma semana sem avanço.",
      "Ligar ou mandar áudio. Texto travou.",6);
  }
  if(st==="termo"){
    const ass=(c.termo&&c.termo.assinaturas)||[], cre=ass.some(a=>a.papel==="creator");
    if(cre) return R("ok","Termo assinado","O creator assinou pelo Conexão Creators.",
      "Mover para Fechado · agendado e bloquear a data em Reservas.",null);
    if(!c.termo) return R("atencao","Termo não gerado","Está na etapa do termo, mas a campanha não foi criada.",
      "Abrir a ficha e clicar em Gerar no Conexão Creators.",null);
    if(d<=2) return R("ok","Termo enviado há "+d+(d===1?" dia":" dias"),"Dentro do prazo de leitura.","Aguardar a assinatura. O link do guia está na ficha.",null);
    if(d<=5) return R("atencao","Termo sem assinatura há "+d+" dias","Passou do D+2.",
      "Lembrar pelo WhatsApp: o guia abre no celular e a assinatura leva dois minutos.",7);
    return R("atras","Termo parado há "+d+" dias","A data segue bloqueada sem contrato.",
      "Ligar ou mandar áudio. Se não assinar até o D+10, libere a data.",8);
  }
  if(st==="proposta"){
    if(d<=2) return R("ok","Proposta há "+d+(d===1?" dia":" dias"),"Dentro do prazo de leitura.","Aguardar até o D+2.",null);
    if(d<=5) return R("atencao","Proposta sem retorno há "+d+" dias","Passou do D+2.",
      "Confirmar recebimento: \"chegou certinho? alguma dúvida?\"",7);
    if(d<=10) return R("atras","Proposta parada há "+d+" dias","Passou do D+5.",
      "Ligar ou mandar áudio. Se não fechar até o D+10, libere a data.",8);
    return R("atras","Proposta vencida há "+d+" dias","Passou do D+10 — a data está bloqueada à toa.",
      "Fechar hoje ou liberar a data para outro creator.",8,{sug:"suspender"});
  }
  return R("ok","Sem pendência","","Nada a fazer agora.",null);
}

/* ---------- arrastar e soltar no funil ---------- */
let arrastando=null, moveu=false;
document.addEventListener("dragstart",e=>{
  const card=e.target.closest("[data-card]"); if(!card)return;
  arrastando=+card.dataset.card; moveu=false;
  card.classList.add("dragging");
  e.dataTransfer.effectAllowed="move";
  try{e.dataTransfer.setData("text/plain",String(arrastando))}catch(x){}
});
document.addEventListener("dragend",e=>{
  document.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging"));
  document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));
  arrastando=null;
});
document.addEventListener("dragover",e=>{
  const zona=e.target.closest("[data-drop]"); if(!zona)return;
  e.preventDefault(); e.dataTransfer.dropEffect="move";
  document.querySelectorAll(".over").forEach(x=>{if(x!==zona)x.classList.remove("over")});
  zona.classList.add("over");
});
document.addEventListener("dragleave",e=>{
  const zona=e.target.closest("[data-drop]");
  if(zona&&!zona.contains(e.relatedTarget))zona.classList.remove("over");
});
document.addEventListener("drop",e=>{
  const zona=e.target.closest("[data-drop]"); if(!zona)return;
  e.preventDefault(); zona.classList.remove("over");
  let id=arrastando;
  if(id==null){try{id=+e.dataTransfer.getData("text/plain")}catch(x){}}
  const c=DB.find(x=>x.id===id); if(!c)return;
  const novo=zona.dataset.drop;
  if(c.st===novo)return;
  const antes=stage(c.st).n;
  touch(c); c.st=novo;
  if(novo!=="perdido"&&c.sit==="suspenso")c.sit="ativo";
  if(novo==="perdido"&&c.sit!=="suspenso")c.sitm="Movido para Perdido no funil.";
  (c.hist=c.hist||[]).push({d:new Date().toISOString().slice(0,10),
    t:"Movido no funil: "+antes+" → "+stage(novo).n});
  moveu=true; save(); buildNav(); render();
  toast(c.n+" → "+stage(novo).n);
});

/* ---------- foto do creator ---------- */
function comprimeFoto(file,cb){
  if(!file)return;
  if(!/^image\//.test(file.type)){toast("Escolha um arquivo de imagem");return}
  const fr=new FileReader();
  fr.onload=ev=>{const img=new Image();
    img.onload=()=>{
      const M=220, s=Math.min(M/img.width,M/img.height,1);
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
      const g=cv.getContext("2d");
      g.fillStyle="#fff"; g.fillRect(0,0,cv.width,cv.height);
      g.drawImage(img,0,0,cv.width,cv.height);
      cb(cv.toDataURL("image/jpeg",.72));
    };
    img.onerror=()=>toast("Não consegui ler essa imagem");
    img.src=ev.target.result;
  };
  fr.readAsDataURL(file);
}

/* arquivo .html independente — abre em qualquer navegador com os links funcionando,
   e de lá a pessoa imprime em PDF se quiser guardar */
function fichaArquivo(f,link,auto){
  const aviso=auto?`<div class="avisoPDF">
      <b>Salve como PDF</b>
      <span>A janela de impressão abre sozinha. Em <b>Destino</b>, escolha
      <b>Salvar como PDF</b> e confirme. Depois é só anexar no WhatsApp.</span>
      <button onclick="window.print()">Abrir a janela de novo</button>
    </div>`:"";
  const script=auto?`<script>window.addEventListener("load",function(){setTimeout(function(){
    try{window.print()}catch(e){}},450)})<\/script>`:"";
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ficha de parceria — ${esc(f.n)}</title>
<style>${CSS_VARS}${CSS_PDF}
.avisoPDF{max-width:620px;margin:0 auto 16px;background:#fff;border:1px solid #E0D2BC;border-radius:14px;
  padding:14px 16px;font-family:var(--font-ui);color:#2E2620;line-height:1.5}
.avisoPDF>b{display:block;font-size:15px;margin-bottom:4px}\n.avisoPDF span b{font-weight:700}
.avisoPDF span{font-size:13px;color:#5D5147}

/* transforma um data:URL em File para a folha de compartilhamento */
function dataParaArquivo(url,nome,tipo){
  const bin=atob(url.split(",")[1]); const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
  return new File([b],nome,{type:tipo});
}
/* Enviar no WhatsApp: tenta anexar a ficha pela folha de compartilhamento do aparelho.
   Só o share nativo consegue anexar arquivo — um link wa.me leva apenas texto. */
async function enviarWhats(f,msg,fallback){
  const base="ficha-"+(f.n||"creator").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  let arq=null;
  try{ arq=dataParaArquivo(await gerarCartaoImg(f),base+".png","image/png"); }catch(e){}
  if(arq&&navigator.canShare&&navigator.canShare({files:[arq]})){
    try{ await navigator.share({files:[arq],text:msg}); return true }
    catch(e){ if(e&&e.name==="AbortError")return true; }
  }
  /* sem folha de compartilhamento: abre a conversa com o texto e o link */
  toast("Aqui só dá para mandar o texto — anexe o arquivo na conversa");
  if(fallback)window.location.href=fallback;
  return false;
}

async function gerarPDF(f,link){
  const dl=window.claude&&window.claude.downloads;
  if(!dl){toast("Download indisponível aqui");return}
  const base="ficha-"+(f.n||"creator").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  try{ await dl.save({filename:base+".html",data:fichaArquivo(f,link,true)});
    toast("Baixado — abra o arquivo e escolha Salvar como PDF"); return }
  catch(e){ if(e&&e.code==="declined")return;
    toast("Não consegui gerar aqui. Use Copiar link ou Baixar imagem."); }
}
async function baixarFicha(f,link){
  const dl=window.claude&&window.claude.downloads;
  const base="ficha-"+(f.n||"creator").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const html=fichaArquivo(f,link);
  if(!dl){toast("Download indisponível aqui");return}
  try{await dl.save({filename:base+".html",data:html});
    toast("Arquivo salvo — abra e use Imprimir para virar PDF");return}
  catch(e){ if(e&&e.code==="declined")return;
    if(!(e&&(e.code==="extension_not_enabled"||e.code==="rejected_extension"))){
      toast("Não consegui salvar: "+(e&&(e.message||e.code)||"erro"));return} }
  /* se .html não estiver liberado, cai para um resumo em texto com os links */
  const linhas=[f.n,f.h,"",
    f.u?"Perfil: "+f.u:"", f.kt?"Mídia kit: "+f.kt:"",
    ...(f.vd||[]).map(v=>(v.t||"Conteúdo")+": "+v.u), "",
    f.ci?"Check-in: "+dataLonga(f.ci):"", f.co?"Check-out: "+dataLonga(f.co):"",
    f.px?"Pessoas: "+f.px:"", f.pm?"Permuta: "+money(f.pm):"",
    f.tr?"Entrega: "+f.tr:"", "", f.bi?"BIG IDEIA\n"+f.bi:"", "", f.ob?"OBSERVAÇÕES\n"+f.ob:""
  ].filter(x=>x!=="").join("\n");
  try{await dl.save({filename:base+".txt",data:linhas});toast("Salvo em texto com os links")}
  catch(e2){if(e2&&e2.code!=="declined")toast("Não consegui salvar o arquivo")}
}

/* ---------- DOCUMENTO DA FICHA (mesmo visual do cartão, com links clicáveis) ---------- */
/* barrinhas no mesmo formato do painel do Meta */
function barras(lista){
  const max=Math.max(...lista.map(x=>x.p),1);
  return `<ul class="pdf-barras">${lista.map(x=>`<li>
    <span class="bl">${esc(x.r)}</span>
    <span class="bp">${String(x.p).replace(".",",")}%</span>
    <span class="bb"><i style="width:${Math.max(6,Math.round(x.p/max*100))}%"></i></span></li>`).join("")}</ul>`;
}

function docPDF(f,link,interativo){

    ${[f.ni,f.pb,f.uf].filter(Boolean).length?
      `<div class="pdf-meta">${[f.ni,f.pb,f.uf].filter(Boolean).map(esc).join(" &middot; ")}</div>`:""}
    ${((f.sl||[]).length||f.pd)?`<div class="pdf-selos">

    ${nums.length?`<div class="pdf-nums">${nums.map(n=>
      `<div><b>${n[0]}</b><span>${n[1]}</span>${n[2]?`<i>${n[2]}</i>`:""}</div>`).join("")}</div>`:""}

    ${(f.ci||f.co)?`<section class="pdf-painel">

      ${d!=null&&d>=0?`<div class="pdf-prazo">Faltam <b>${d} dias</b> para a entrada</div>`:""}

        <textarea id="v-acomp" rows="2" placeholder="Um nome por linha">${esc(c.acomp||c.n||"")}</textarea>
