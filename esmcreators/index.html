      <div class="field full"><label>Observações para a equipe</label>
        <textarea id="v-obs" placeholder="Horário de chegada, ensaio com o marketing, restrição alimentar, cortesias combinadas…">${esc(c.obsRes)}</textarea></div>
    </div>`;
  $("#vTitle").textContent="Voucher · "+(c.n||"creator");
  $("#vmodal").classList.add("on"); $("#scrim").classList.add("on");
  setTimeout(()=>{const e=$("#v-checkin"); if(e)e.focus()},60);
}
function closeVoucher(){
  $("#vmodal").classList.remove("on");
  if(!document.querySelector(".modal.on"))$("#scrim").classList.remove("on");
  vou=null;
}
function colheVoucher(){
  if(!vou)return null;
  const V=k=>{const e=$("#v-"+k);return e?e.value.trim():""};
  const N=k=>{const v=V(k);return v===""?null:Number(v)};
  vou.checkin=V("checkin"); vou.checkout=V("checkout");
  vou.pax=N("pax"); vou.criancas=N("criancas"); vou.idades=V("idades");
  vou.quarto=V("quarto"); vou.pensao=V("pensao");
  vou.acomp=V("acomp"); vou.obsRes=V("obs");
  touch(vou); save();
  return vou;
}
function salvarVoucher(){
  if(!colheVoucher())return;
  closeVoucher(); render(); toast("Dados da reserva salvos na ficha");
}
async function baixarVoucher(){
  const c=colheVoucher(); if(!c)return;
  if(!c.checkin&&!c.checkout){
    toast("Preencha ao menos uma data de hospedagem");
    const e=$("#v-checkin"); if(e)e.focus(); return;}
  const dl=window.claude&&window.claude.downloads;
  if(!dl){toast("Download indisponível aqui");return}
  const url=gerarVoucherImg(c);
  const bin=atob(url.split(",")[1]); const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
  const nome="voucher-"+(c.n||"creator").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+".jpeg";
  try{ await dl.save({filename:nome,data:b.buffer});
    closeVoucher(); render(); toast("Voucher salvo como imagem"); }
  catch(e){ if(e&&e.code!=="declined")toast("Não consegui salvar a imagem") }
}

function gerarVoucherImg(c){
  const t=document.createElement("canvas"); t.width=1080; t.height=4200;
  const fim=pintaVoucher(t.getContext("2d"),c);
  const H=Math.round(fim+68);
  const cv=document.createElement("canvas"); cv.width=1080; cv.height=H;
  pintaVoucher(cv.getContext("2d"),c);
  return cv.toDataURL("image/jpeg",.94);
}

function pintaVoucher(g,c){
  const W=1080, M=72, CW=W-M*2;
  const TINTA="#221B12", FRACO="#6E6154", FIO="#E2D9CB", MARCA="#6B5335", CREME="#FFF8EE";

  g.fillStyle="#FFFFFF"; g.fillRect(0,0,W,4200);

  const esq=(s,x,y,px,peso,cor,maxW)=>{
    fonte(g,px,peso); g.fillStyle=cor; g.textAlign="left";
    let t=String(s);
    if(maxW){while(g.measureText(t).width>maxW&&t.length>4)t=t.slice(0,-1);
      if(t!==String(s))t=t.slice(0,-1)+"…"}
    g.fillText(t,x,y);
  };
  const rot=(s,x,y,cor)=>{
    fonte(g,17,"700");
    try{g.letterSpacing="2.4px"}catch(e){}
    g.fillStyle=cor||FRACO; g.textAlign="left";
    g.fillText(String(s).toUpperCase(),x,y);
    try{g.letterSpacing="0px"}catch(e){}
  };
  const linhasDe=(s,px,peso,maxW)=>{
    fonte(g,px,peso); const out=[];
    String(s).split(/\r?\n/).forEach(par=>{
      if(!par.trim()){if(out.length)out.push("");return}
      const pal=par.trim().split(/\s+/); let cur="";
      for(const p of pal){const t=cur?cur+" "+p:p;
        if(g.measureText(t).width>maxW&&cur){out.push(cur);cur=p}else cur=t}
      if(cur)out.push(cur);
    });
    return out;
  };
  const desenha=(ls,x,y,px,peso,cor,lh)=>{
    fonte(g,px,peso); g.fillStyle=cor; g.textAlign="left";
    ls.forEach((l,i)=>g.fillText(l,x,y+i*lh));
  };

  /* faixa da marca */
  const gr=g.createLinearGradient(0,0,W,150);
  gr.addColorStop(0,"#2C1F13"); gr.addColorStop(.6,"#6B5335"); gr.addColorStop(1,"#48371F");
  g.fillStyle=gr; g.fillRect(0,0,W,150);
  esq("Esmeralda Praia Hotel",M,76,40,"600",CREME);
  rot("Voucher de hospedagem",M,113,"#E8C77A");
  fonte(g,20,"500"); g.fillStyle="rgba(255,248,238,.7)"; g.textAlign="right";
  g.fillText(new Date().toLocaleDateString("pt-BR"),W-M,113);

  /* nome do hospede */
  let y=150+86;
  esq(c.n||"—",M,y,50,"700",TINTA,CW);
  if(c.h&&c.h!=="—"){y+=38; esq(c.h,M,y,25,"500",MARCA,CW)}
  y+=46;

  /* medidas do quadro */
  const nt=noites(c.checkin,c.checkout);
  const kids=c.criancas||0, tot=c.pax||0, ad=Math.max(0,tot-kids);
  const resumo=[tot?tot+(tot>1?" pessoas":" pessoa"):"",
                tot?ad+(ad===1?" adulto":" adultos"):"",
                kids?kids+(kids>1?" crianças":" criança")+(c.idades?" ("+c.idades+")":""):""]
               .filter(Boolean).join("  ·  ");
  const nomes=c.acomp?linhasDe(c.acomp,25,"500",CW-68):[];
  const obs=c.obsRes?linhasDe(c.obsRes,24,"400",CW-68):[];
  const temQ=!!(c.quarto||c.pensao), temH=!!(resumo||nomes.length);

  const hDatas=158, hQuarto=140;
  const hHosp=(nomes.length?134+(nomes.length-1)*36:92)+44;
  const hObs=obs.length?88+(obs.length-1)*34+42:0;
  const H=hDatas+(temQ?hQuarto:0)+(temH?hHosp:0)+hObs;
  const topo=y;

  g.strokeStyle=FIO; g.lineWidth=2; arred(g,M,y,CW,H,22); g.stroke();
  const fioH=yy=>{g.strokeStyle=FIO;g.lineWidth=2;g.beginPath();g.moveTo(M,yy);g.lineTo(M+CW,yy);g.stroke()};
  const fioV=(x,a,b)=>{g.strokeStyle=FIO;g.lineWidth=2;g.beginPath();g.moveTo(x,a);g.lineTo(x,b);g.stroke()};

  /* datas */
  const col=CW/3;
  const celula=(i,rotulo,valor,sub,cor)=>{
    const x=M+i*col+32;
    rot(rotulo,x,y+48);
    esq(valor,x,y+102,32,"700",cor||TINTA,col-56);
    if(sub)esq(sub,x,y+134,20,"500",FRACO,col-56);
  };
  celula(0,"Check-in",dataLonga(c.checkin)||"a definir",diaSem(c.checkin));
  celula(1,"Noites",nt!=null?String(nt):"—","",MARCA);
  celula(2,"Check-out",dataLonga(c.checkout)||"a definir",diaSem(c.checkout));
  fioV(M+col,y+28,y+hDatas-28); fioV(M+2*col,y+28,y+hDatas-28);
  y+=hDatas;

  /* apartamento e pensao */
  if(temQ){
    fioH(y);
    rot("Apartamento",M+32,y+48);
    esq(c.quarto||"—",M+32,y+96,26,"600",TINTA,CW/2-64);
    rot("Pensão",M+CW/2+32,y+48);
    esq(c.pensao||"—",M+CW/2+32,y+96,26,"600",TINTA,CW/2-64);
    fioV(M+CW/2,y+28,y+hQuarto-28);
    y+=hQuarto;
  }

  /* quem se hospeda */
  if(temH){
    fioH(y);
    rot("Hóspedes",M+32,y+48);
    if(resumo)esq(resumo,M+32,y+92,26,"600",TINTA,CW-64);
    if(nomes.length)desenha(nomes,M+32,y+134,25,"500",FRACO,36);
    y+=hHosp;
  }

  /* observacoes */
  if(obs.length){
    fioH(y);
    rot("Observações",M+32,y+48);
    desenha(obs,M+32,y+88,24,"400",TINTA,34);
    y+=hObs;
  }

  return topo+H+56;
}

/* ---------- CARTÃO EM IMAGEM (formato story 1080×1920) ---------- */
const UI='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif';
function carregaImg(src){return new Promise(res=>{
  if(!src)return res(null);
  const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src;});}

function fonte(g,px,peso){g.font=peso+" "+px+"px "+UI}
function centro(g,s,y,px,peso,cor,maxW){
  fonte(g,px,peso); g.fillStyle=cor; g.textAlign="center";
  let t=s; if(maxW){while(g.measureText(t).width>maxW&&t.length>4)t=t.slice(0,-1); if(t!==s)t=t.slice(0,-1)+"…"}
  g.fillText(t,540,y); return px;
}
function quebra(g,s,y,px,peso,cor,maxW,lh,maxL){
  fonte(g,px,peso); g.fillStyle=cor; g.textAlign="center";
  const linhas=[];
  /* quebra de linha digitada vale; linha em branco vira respiro */
  String(s).split(/\r?\n/).forEach(par=>{
    if(!par.trim()){if(linhas.length)linhas.push("");return}
    const pal=par.trim().split(/\s+/); let cur="";
    for(const p of pal){const t=cur?cur+" "+p:p;
      if(g.measureText(t).width>maxW&&cur){linhas.push(cur);cur=p}else cur=t;}
    if(cur)linhas.push(cur);
  });
  const use=linhas.slice(0,maxL||99);
  if(linhas.length>use.length)use[use.length-1]=use[use.length-1].replace(/.{2}$/,"…");
  use.forEach((l,i)=>g.fillText(l,540,y+i*lh));
  return y+use.length*lh;
}
function arred(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

async function gerarCartaoImg(f){
  const img=await carregaImg(f.ft);
  /* primeira passada mede, segunda desenha na altura certa */
  const t=document.createElement("canvas"); t.width=1080; t.height=5200;
  const fim=pintaCartao(t.getContext("2d"),f,5200,img);
  const H=Math.max(1920,Math.round(fim+232));
  const cv=document.createElement("canvas"); cv.width=1080; cv.height=H;
  pintaCartao(cv.getContext("2d"),f,H,img);
  return cv.toDataURL("image/png");
}

function painel(g,y,alt,titulo,AREIA){
  g.fillStyle="rgba(255,248,238,.10)"; arred(g,90,y,900,alt,40); g.fill();
  g.strokeStyle="rgba(232,199,122,.36)"; g.lineWidth=2; g.stroke();
  if(titulo){fonte(g,24,"700"); g.fillStyle=AREIA; g.textAlign="center";
    g.fillText(titulo.split("").join(" "),540,y+52);}
}

function pintaCartao(g,f,H,img){
  const W=1080;
  const CREME="#FFF8EE", AREIA="#E8C77A", SUAVE="rgba(255,248,238,.64)",
        FRACO="rgba(255,248,238,.82)";

  /* fundo: marrom da identidade do Esmeralda */
  const gr=g.createLinearGradient(0,0,W*.55,H);
  gr.addColorStop(0,"#2C1F13"); gr.addColorStop(.42,"#6B5335");
  gr.addColorStop(.78,"#57422A"); gr.addColorStop(1,"#2A1E12");
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  [[880,H*.16,540,"rgba(232,199,122,.22)"],
   [140,H*.74,640,"rgba(200,155,90,.18)"],
   [540,H*.45,820,"rgba(255,255,255,.045)"]].forEach(([x,y,r,c])=>{
    const rg=g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,c); rg.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=rg; g.fillRect(0,0,W,H);});

  let y=118;
  g.textAlign="center";
  fonte(g,26,"700"); g.fillStyle=AREIA;
  g.fillText("E S M E R A L D A   P R A I A   H O T E L",540,y); y+=48;
  centro(g,"Ficha para aprovação",y,34,"500",SUAVE); y+=92;

  /* foto */
  const R=162, CY=y+R;
  g.save(); g.beginPath(); g.arc(540,CY,R,0,7); g.closePath();
  g.strokeStyle=AREIA; g.lineWidth=7; g.stroke(); g.clip();
  if(img){const s=Math.max(2*R/img.width,2*R/img.height);
    g.drawImage(img,540-img.width*s/2,CY-img.height*s/2,img.width*s,img.height*s);
  }else{g.fillStyle="rgba(255,248,238,.14)"; g.fillRect(540-R,CY-R,2*R,2*R);
    fonte(g,116,"600"); g.fillStyle=CREME; g.textAlign="center"; g.textBaseline="middle";
    g.fillText(initials(f.n||"?"),540,CY); g.textBaseline="alphabetic";}
  g.restore();
  y=CY+R+78;

  y=quebra(g,f.n||"",y,(f.n&&f.n.length>20)?56:68,"700",CREME,900,72,2)+6;
  if(f.h&&f.h!=="—"){centro(g,f.h,y,33,"500",AREIA,900); y+=58;}
  if(f.ni||f.pb||f.uf){
    y+=6; y=quebra(g,[f.ni,f.pb,f.uf].filter(Boolean).join("  ·  "),y,26,"400",SUAVE,880,38,2)+22;
  }

  /* números */
  const nums=[[f.sg?curto(f.sg):null,"seguidores"],
    [f.ti!=null?String(f.ti).replace(".",",")+"%":null,"interação"],
    [f.ta!=null?String(f.ta).replace(".",",")+"%":null,"atenção"]].filter(x=>x[0]);
  if(nums.length){
    const lg=900/nums.length;
    nums.forEach((n,i)=>{const cx=90+lg*i+lg/2;
      fonte(g,nums.length>2?58:68,"700"); g.fillStyle=CREME; g.textAlign="center";
      g.fillText(n[0],cx,y+54);
      fonte(g,24,"500"); g.fillStyle=SUAVE; g.fillText(n[1],cx,y+92);});
    y+=150;
  }

  /* hospedagem */
  const nt=noites(f.ci,f.co);
  if(f.ci||f.co){
    const A=244; painel(g,y,A,"HOSPEDAGEM",AREIA);
    [["Entrada",dataLonga(f.ci)||"a definir",diaSem(f.ci),320],
     ["Saída",dataLonga(f.co)||"a definir",diaSem(f.co),760]].forEach(d=>{
      fonte(g,23,"500"); g.fillStyle=SUAVE; g.textAlign="center"; g.fillText(d[0],d[3],y+102);
      fonte(g,40,"700"); g.fillStyle=CREME; g.fillText(d[1],d[3],y+150);
      fonte(g,22,"400"); g.fillStyle=SUAVE; g.fillText(d[2],d[3],y+185);});
    fonte(g,42,"300"); g.fillStyle=AREIA; g.fillText("→",540,y+148);
    const pes=[nt!=null?nt+(nt===1?" noite":" noites"):null,
               f.px?f.px+(f.px===1?" pessoa":" pessoas"):null].filter(Boolean).join("   ·   ");
    if(pes){fonte(g,27,"600"); g.fillStyle=AREIA; g.fillText(pes,540,y+222);}
    y+=A+40;
  }

  /* a parceria */
  if(f.tr||f.pm){
    const ini=y, topo=y+92;
    let yy=topo;
    if(f.tr){
      fonte(g,22,"500"); g.fillStyle=SUAVE; g.textAlign="center";
      g.fillText("O QUE ELE ENTREGA",540,yy); yy+=44;
      yy=quebra(g,f.tr,yy,30,"600",CREME,800,44,3)+18;
    }
    if(f.pm){
      fonte(g,22,"500"); g.fillStyle=SUAVE; g.textAlign="center";
      g.fillText("VALOR DA PERMUTA",540,yy); yy+=50;
      centro(g,money(f.pm),yy,48,"700",AREIA,800); yy+=30;
    }
    const A=yy-ini+34;
    painel(g,ini,A,"A PARCERIA",AREIA);
    /* repinta o conteúdo por cima do painel */
    yy=topo;
    if(f.tr){
      fonte(g,22,"500"); g.fillStyle=SUAVE; g.textAlign="center";
      g.fillText("O QUE ELE ENTREGA",540,yy); yy+=44;
      yy=quebra(g,f.tr,yy,30,"600",CREME,800,44,3)+18;
    }
    if(f.pm){
      fonte(g,22,"500"); g.fillStyle=SUAVE; g.textAlign="center";
      g.fillText("VALOR DA PERMUTA",540,yy); yy+=50;
      centro(g,money(f.pm),yy,48,"700",AREIA,800);
    }
    y=ini+A+40;
  }

  /* big ideia */
  if(f.bi){
    y+=8;
    fonte(g,23,"700"); g.fillStyle=AREIA; g.textAlign="center";
    g.fillText("B I G   I D E I A",540,y); y+=48;
    y=quebra(g,f.bi,y,28,"400",FRACO,860,42,6)+34;
  }

  /* observações */
  if(f.ob){
    g.strokeStyle="rgba(255,248,238,.16)"; g.lineWidth=2;
    g.beginPath(); g.moveTo(330,y); g.lineTo(750,y); g.stroke(); y+=54;
    fonte(g,23,"700"); g.fillStyle=AREIA; g.textAlign="center";
    g.fillText("O B S E R V A Ç Õ E S",540,y); y+=46;
    y=quebra(g,f.ob,y,26,"400",SUAVE,860,40,7)+20;
  }

  /* rodapé */
  const RY=H-172;
  g.fillStyle="rgba(255,248,238,.13)"; arred(g,90,RY,900,104,52); g.fill();
  fonte(g,30,"600"); g.fillStyle=CREME; g.textAlign="center";
  g.fillText(f.de?f.de+" pediu sua aprovação":"Aguardando sua aprovação",540,RY+50);
  fonte(g,24,"400"); g.fillStyle=SUAVE;
  g.fillText("Abra o link para aprovar ou reprovar",540,RY+84);
  return y;
}

async function baixarCartao(f){
  const dl=window.claude&&window.claude.downloads;
  const url=await gerarCartaoImg(f);
  if(!dl){toast("Segure a imagem para salvar");return}
  const bin=atob(url.split(",")[1]); const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
  const nome="ficha-"+(f.n||"creator").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+".png";
  try{await dl.save({filename:nome,data:b.buffer});toast("Imagem salva")}
  catch(e){if(e&&e.code!=="declined")toast("Segure a imagem para salvar")}
}


/* ================= SINCRONIZACAO ENTRE APARELHOS =================
   Os dados ficam gravados dentro da propria pagina. Ao sincronizar,
   a pagina se republica com os dados de agora, e qualquer aparelho
   que abrir o mesmo link recebe tudo. */
let SYNC={estado:"parado",pendentes:0,erro:"",leitura:false};
let syncT=null;

function paginaHTML(){
  if(!MARCACAO||MARCACAO.length<500)throw new Error("markup vazio - nao vou republicar");
  const dados=JSON.stringify({DB,ALOC,RESP,NEXTID,em:new Date().toISOString()});
  const css=(document.getElementById("css")||{textContent:""}).textContent;
  return "<!doctype html><html lang=\"pt-BR\"><head><meta charset=\"utf-8\">"+
    "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">"+
    "<title>EsmCreators \u2014 Gest\u00e3o de Creators \u00b7 Esmeralda Praia Hotel</title>"+
    "<style id=\"css\">"+css+"</style>"+
    "<scr"+"ipt id=\"dados\" type=\"application/json\">"+
      dados.replace(/</g,"\\u003c")+"</scr"+"ipt>"+
    "</head><body>"+MARCACAO+"<scr"+"ipt>"+FONTE_JS+"</scr"+"ipt></body></html>";
}

function marcaPendente(){
  if(SYNC.leitura)return;
  SYNC.pendentes++; SYNC.estado="pendente"; pintaSync();
  clearTimeout(syncT); syncT=setTimeout(sincronizar,6000);
}

async function sincronizar(silencioso){
  const s=window.claude&&window.claude.self;
  if(!s){SYNC.estado="indisponivel";pintaSync();return}
  if(SYNC.estado==="enviando")return;
  clearTimeout(syncT);
  if(document.querySelector(".modal.on")){
    syncT=setTimeout(sincronizar,6000); return;
  }
  SYNC.estado="enviando"; pintaSync();
  try{
    try{sessionStorage.setItem("esmvolta",JSON.stringify({v:cur,q:q}))}catch(e){}
    await s.publish(paginaHTML());
    SYNC.pendentes=0; SYNC.estado="ok"; pintaSync();
  }catch(e){
    const c=e&&e.code;
    if(c==="conflict"){ SYNC.estado="ok"; pintaSync(); return }
    if(c==="not_writer"||c==="not_granted"||c==="not_declared"||
       c==="capability_disabled"||c==="capability_removed"){
      SYNC.leitura=true; SYNC.estado="leitura"; pintaSync(); return }
    if(c==="rate_limited"){ SYNC.estado="pendente"; pintaSync();
      syncT=setTimeout(sincronizar,20000); return }
    SYNC.estado="erro"; SYNC.erro=(e&&e.message)||""; pintaSync();
    if(!silencioso)toast("Nao consegui sincronizar agora");
  }
}

function pintaSync(){
  const b=document.getElementById("syncBtn"); if(!b)return;
  const m={parado:["\u25cf Sincronizado","ok"],ok:["\u25cf Sincronizado","ok"],
    pendente:["\u25cf "+SYNC.pendentes+" para enviar","pend"],
    enviando:["\u21bb Enviando\u2026","pend"],
    leitura:["\u25cf Somente leitura","ler"],
    indisponivel:["\u25cf S\u00f3 neste aparelho","ler"],
    erro:["\u26a0 Falhou","err"]};
  const par=m[SYNC.estado]||m.parado;
  b.textContent=par[0]; b.className="syncb "+par[1];
  b.title=SYNC.estado==="erro"?SYNC.erro
    :SYNC.estado==="leitura"?"Voce pode ver, mas nao gravar nesta pagina"
    :SYNC.estado==="indisponivel"?"Esta visualizacao nao grava na pagina; os dados ficam so neste navegador"
    :"Os dados ficam gravados na propria pagina e abrem igual em qualquer aparelho";
}

/* chega pelo link #resposta= que o supervisor devolve.
   Aplica a decisao na ficha e deixa a notificacao no painel. */
function receberResposta(r){
  if(!r||!r.n)return false;
  const chave=[r.n,r.d,r.t||"",r.q||""].join("|");
  if(RESP.some(x=>x.chave===chave))return false;            /* abrir o link 2x nao duplica */
  const c=(r.h&&r.h!=="\u2014"&&DB.find(x=>x.h&&x.h.toLowerCase()===String(r.h).toLowerCase()))
        ||DB.find(x=>x.n.toLowerCase()===String(r.n).toLowerCase())||null;
  const quando=r.q||new Date().toISOString().slice(0,10);
  const d=DECS[r.d];
  RESP.unshift({chave,n:r.n,h:r.h||"",d:r.d,t:r.t||"",q:quando,cid:c?c.id:null,lida:false});
  salvaResp();
  if(c){
    touch(c);
    if(r.d==="aprovado"){c.ap="aprovado";c.apm=r.t||"Aprovado pelo supervisor"}
    else if(r.d==="ajuste"){c.ap="aprovado";c.apm="Com ajuste: "+(r.t||"sem detalhe")}
    else if(r.d==="reprovado"){c.ap="reprovado";c.apm=r.t||"Reprovado pelo supervisor";c.g="C";c.st="perdido"}
    (c.hist=c.hist||[]).push({d:quando,
      t:(d?d.n:r.d)+" pelo supervisor"+(r.t?" \u2014 "+r.t:"")});
    save();
  }
  return true;
}

/* atalhos: / busca · N novo creator · G vai para Hoje */
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const t=e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
  if(document.querySelector(".modal.on"))return;
  if(e.key==="/"){e.preventDefault();$("#gsearch").focus();$("#gsearch").select()}
  else if(e.key.toLowerCase()==="n"){e.preventDefault();openForm()}
  else if(e.key.toLowerCase()==="g"){e.preventDefault();go("gerenciar")}
});

/* prende o foco dentro do modal aberto */
document.addEventListener("keydown",e=>{
  if(e.key!=="Tab")return;
  const box=document.querySelector(".modal.on .mbox"); if(!box)return;
  const f=[...box.querySelectorAll('a[href],button,input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(x=>!x.disabled&&x.offsetParent!==null);
  if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
});
$("#themeBtn").onclick=()=>{const r=document.documentElement;
  const dark=r.getAttribute("data-theme")==="dark"||
    (!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);
  r.setAttribute("data-theme",dark?"light":"dark")};

/* re-render preservando onde a pessoa estava: rolagem da página, rolagem
   horizontal do kanban/tabela e o campo que estava em foco */
function render(){
  const y=window.scrollY;
  const scrolls=[...document.querySelectorAll(".tw,.board,.colbody,.nlist,.qlist")]
    .map(el=>[el.className,el.scrollLeft,el.scrollTop]);
  const fa=document.activeElement, key=fa&&fa.dataset&&(fa.dataset.in||fa.dataset.aloc||fa.id);
  try{ VMAP[cur](); }
  catch(err){
    console.error(err);
    $("#v-"+cur).innerHTML=`<div class="alert crit"><span class="ai">⚠️</span><div>
      <b>Não consegui montar esta tela</b><p>${esc(err.message)}. Os dados estão salvos — recarregue a página.</p>
      </div></div>`;
  }
  document.querySelectorAll(".tw,.board,.colbody,.nlist,.qlist").forEach((el,i)=>{
    const s=scrolls.find(x=>x[0]===el.className); if(s){el.scrollLeft=s[1];el.scrollTop=s[2]}
  });
  window.scrollTo(0,y);
  if(key){const back=document.querySelector(`[data-in="${key}"],[data-aloc="${key}"],#${CSS.escape(key)}`);
    if(back&&back.focus)back.focus({preventScroll:true})}
}
